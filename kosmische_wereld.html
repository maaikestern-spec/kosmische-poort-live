eTo(canvas.width,y);ctx.stroke();let x=(i*canvas.width)/20;ctx.beginPath();ctx.moveTo(mx,my-50);ctx.lineTo(x,canvas.height);ctx.stroke();}ctx.lineWidth=3;ctx.strokeStyle=active?clr:"#ff0055";let r=60+Math.sin(t*2)*2,rot=active?t*1.2:t*0.2;ctx.beginPath();ctx.arc(mx-50,my-100,r,rot,rot+Math.PI*1.8);ctx.stroke();ctx.beginPath();ctx.arc(mx+50,my-100,r,-rot,-rot+Math.PI*1.8);ctx.stroke();let h=[40,40,40];if(active){h=[180+Math.sin(t*1.2)*80,180+Math.cos(t*1)*80,180+Math.sin(t*0.8)*80];}const lbl=["MI","KA","EL"];for(let i=0;i<3;i++){let x=mx-90+(i*70);ctx.fillStyle=active?"#fff":"#555";ctx.fillRect(x,canvas.height-50-h[i],40,h[i]);if(active){ctx.strokeStyle=clr;ctx.lineWidth=2;ctx.strokeRect(x,canvas.height-50-h[i],40,h[i]);}ctx.fillStyle="#bbb";ctx.fillText(lbl[i],x+10,canvas.height-30);}requestAnimationFrame(draw);}draw();</script><body></html>
